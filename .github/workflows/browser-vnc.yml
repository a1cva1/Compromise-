name: Browser VNC (Quick Tunnel - Final)

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Runtime in minutes (max 360)"
        required: false
        default: "355"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  browser-vnc:
    runs-on: windows-latest
    timeout-minutes: 370

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set runtime
        run: |
          $rt = [int]"${{ github.event.inputs.runtime_minutes }}"
          if ($rt -lt 5) { $rt = 355 }
          "RUNTIME_MINUTES=$rt" | Out-File -Append $env:GITHUB_ENV

      - name: Install TightVNC Server
        run: |
          $vncUrl = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          $vncMsi = "$env:TEMP\tightvnc.msi"
          Invoke-WebRequest $vncUrl -OutFile $vncMsi

          $vncPassword = "Bullet@12345"
          "VNC_PASSWORD=$vncPassword" | Out-File -Append $env:GITHUB_ENV

          $args = @(
            "/i", "`"$vncMsi`"",
            "/quiet", "/norestart",
            "ADDLOCAL=Server",
            "SET_USEVNCAUTHENTICATION=1",
            "VALUE_OF_USEVNCAUTHENTICATION=1",
            "SET_PASSWORD=$vncPassword",
            "VALUE_OF_PASSWORD=$vncPassword",
            "SET_VIEWONLYPASSWORD=$vncPassword",
            "VALUE_OF_VIEWONLYPASSWORD=$vncPassword"
          )
          Start-Process msiexec.exe -ArgumentList $args -Wait

          Start-Service -Name "tvnserver" -ErrorAction SilentlyContinue
          Set-Service -Name "tvnserver" -StartupType Automatic

          New-NetFirewallRule -DisplayName "VNC 5900" -Direction Inbound -Protocol TCP -LocalPort 5900 -Action Allow

          # Verify VNC port
          $vncOk = $false
          for ($i=0; $i -lt 6; $i++) {
            if (Test-NetConnection -ComputerName localhost -Port 5900 -InformationLevel Quiet) {
              $vncOk = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if ($vncOk) { Write-Host "✅ TightVNC is listening on port 5900." }
          else { Write-Host "⚠️ VNC port 5900 not responding yet, but continuing..." }

      - name: Install noVNC and websockify
        run: |
          Write-Host "Python path: $(Get-Command python | Select-Object -ExpandProperty Source)"
          python --version
          python -m pip install --upgrade pip
          python -m pip install websockify

          $novncZip = "$env:TEMP\novnc.zip"
          Invoke-WebRequest "https://github.com/novnc/noVNC/archive/refs/tags/v1.4.0.zip" -OutFile $novncZip
          Expand-Archive $novncZip -DestinationPath "$env:TEMP\novnc" -Force
          $novncDir = "$env:TEMP\novnc\noVNC-1.4.0"
          "NOVNC_DIR=$novncDir" | Out-File -Append $env:GITHUB_ENV

          # Verify websockify installed
          python -c "import websockify; print('websockify version:', websockify.__version__)"
          Write-Host "✅ noVNC and websockify installed."

      - name: Start websockify (noVNC web + VNC proxy)
        run: |
          $novncDir = $env:NOVNC_DIR
          Write-Host "noVNC dir: $novncDir"

          $wsLog = "$env:TEMP\websockify.out.log"
          $wsErr = "$env:TEMP\websockify.err.log"
          Remove-Item $wsLog, $wsErr -ErrorAction SilentlyContinue

          # Start websockify as a background process, capturing output
          $argList = @("-m", "websockify", "--web", "`"$novncDir`"", "8080", "localhost:5900")
          $proc = Start-Process -FilePath "python" -ArgumentList $argList -NoNewWindow -PassThru -RedirectStandardOutput $wsLog -RedirectStandardError $wsErr

          # Wait for port 8080 (up to 60 seconds)
          $wsOk = $false
          for ($i=0; $i -lt 12; $i++) {
              Start-Sleep -Seconds 5
              if (Test-NetConnection -ComputerName localhost -Port 8080 -InformationLevel Quiet) {
                  $wsOk = $true
                  break
              }
              if ($proc.HasExited) {
                  Write-Host "websockify process exited early with code $($proc.ExitCode)."
                  break
              }
          }

          if ($wsOk) {
              Write-Host "✅ websockify is listening on port 8080."
              "WS_PID=$($proc.Id)" | Out-File -Append $env:GITHUB_ENV
          } else {
              Write-Host "❌ websockify failed to start. Output:"
              Write-Host "--- STDOUT ---"
              if (Test-Path $wsLog) { Get-Content $wsLog }
              Write-Host "--- STDERR ---"
              if (Test-Path $wsErr) { Get-Content $wsErr }
              exit 1
          }

      - name: Local HTTP test
        run: |
          try {
              $resp = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing -TimeoutSec 10
              Write-Host "✅ Local noVNC HTTP status: $($resp.StatusCode)"
          } catch {
              Write-Host "❌ Local HTTP test failed: $($_.Exception.Message)"
              exit 1
          }

      - name: Start Cloudflare Quick Tunnel and Capture URL
        run: |
          $cfExe = "$env:TEMP\cloudflared.exe"
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cfExe

          $cfOut = "$env:TEMP\cf_stdout.log"
          $cfErr = "$env:TEMP\cf_stderr.log"
          Remove-Item $cfOut, $cfErr -ErrorAction SilentlyContinue

          $cfProc = Start-Process -FilePath $cfExe -ArgumentList @("tunnel","--url","http://localhost:8080","--no-autoupdate") -NoNewWindow -PassThru -RedirectStandardOutput $cfOut -RedirectStandardError $cfErr

          $tunnelUrl = $null
          for ($i = 0; $i -lt 12; $i++) {
              Start-Sleep -Seconds 5
              $output = ""
              if (Test-Path $cfOut) { $output += Get-Content $cfOut -Raw }
              if (Test-Path $cfErr) { $output += Get-Content $cfErr -Raw }
              $match = $output | Select-String -Pattern "https://[a-zA-Z0-9-]+\.trycloudflare\.com" -AllMatches | ForEach-Object { $_.Matches.Value } | Select-Object -First 1
              if ($match) {
                  $tunnelUrl = $match
                  break
              }
              if ($cfProc.HasExited) { break }
          }

          if ($tunnelUrl) {
              "TUNNEL_URL=$tunnelUrl" | Out-File -Append $env:GITHUB_ENV
              Write-Host "=============================================="
              Write-Host "🌐 YOUR ACCESS URL: $tunnelUrl"
              Write-Host "👤 VNC Password: $env:VNC_PASSWORD"
              Write-Host "=============================================="
          } else {
              Write-Host "❌ Quick Tunnel URL not found. Logs:"
              if (Test-Path $cfOut) { Write-Host "--- STDOUT ---"; Get-Content $cfOut }
              if (Test-Path $cfErr) { Write-Host "--- STDERR ---"; Get-Content $cfErr }
              exit 1
          }

          "CF_PID=$($cfProc.Id)" | Out-File -Append $env:GITHUB_ENV

      - name: Keep Alive Loop (URL সহ)
        run: |
          $end = (Get-Date).AddMinutes([int]$env:RUNTIME_MINUTES)
          while ((Get-Date) -lt $end) {
              Write-Host "=============================================="
              Write-Host "🟢 Session Active Until: $end"
              Write-Host "🌐 Access URL: $env:TUNNEL_URL"
              Write-Host "👤 VNC Password: $env:VNC_PASSWORD"
              Write-Host "=============================================="
              Start-Sleep -Seconds 60
          }
