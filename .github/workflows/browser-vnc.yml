name: Browser VNC (Quick Tunnel)

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Runtime in minutes (max 360)"
        required: false
        default: "355"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  browser-vnc:
    runs-on: windows-latest
    timeout-minutes: 370

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set runtime
        run: |
          $rt = [int]"${{ github.event.inputs.runtime_minutes }}"
          if ($rt -lt 5) { $rt = 355 }
          "RUNTIME_MINUTES=$rt" | Out-File -Append $env:GITHUB_ENV

      - name: Install TightVNC Server
        run: |
          $vncUrl = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          $vncMsi = "$env:TEMP\tightvnc.msi"
          Invoke-WebRequest $vncUrl -OutFile $vncMsi

          $vncPassword = "Bullet@12345"   # আপনি চাইলে বদলাতে পারেন

          $args = @(
            "/i", "`"$vncMsi`"",
            "/quiet", "/norestart",
            "ADDLOCAL=Server",
            "SET_USEVNCAUTHENTICATION=1",
            "VALUE_OF_USEVNCAUTHENTICATION=1",
            "SET_PASSWORD=$vncPassword",
            "VALUE_OF_PASSWORD=$vncPassword",
            "SET_VIEWONLYPASSWORD=$vncPassword",
            "VALUE_OF_VIEWONLYPASSWORD=$vncPassword"
          )
          Start-Process msiexec.exe -ArgumentList $args -Wait

          Start-Service -Name "tvnserver" -ErrorAction SilentlyContinue
          Set-Service -Name "tvnserver" -StartupType Automatic

          New-NetFirewallRule -DisplayName "VNC 5900" -Direction Inbound -Protocol TCP -LocalPort 5900 -Action Allow

      - name: Install noVNC and websockify
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockify

          $novncZip = "$env:TEMP\novnc.zip"
          Invoke-WebRequest "https://github.com/novnc/noVNC/archive/refs/tags/v1.4.0.zip" -OutFile $novncZip
          Expand-Archive $novncZip -DestinationPath "$env:TEMP\novnc"
          $novncDir = "$env:TEMP\novnc\noVNC-1.4.0"

          # Start websockify serving noVNC web files and proxying VNC
          Start-Process python -ArgumentList "-m","websockify","--web",$novncDir,"8080","localhost:5900" -NoNewWindow

      - name: Start Cloudflare Quick Tunnel
        run: |
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          $cfExe = "$env:TEMP\cloudflared.exe"
          Invoke-WebRequest $cfUrl -OutFile $cfExe

          # Quick Tunnel: কোনো token লাগে না, random URL দেয়
          $proc = Start-Process $cfExe -ArgumentList "tunnel","--url","http://localhost:8080","--no-autoupdate" -NoNewWindow -PassThru -RedirectStandardOutput "$env:TEMP\cf_stdout.log" -RedirectStandardError "$env:TEMP\cf_stderr.log"

          # URL capture করার জন্য কিছুক্ষণ অপেক্ষা
          Start-Sleep -Seconds 15
          $urlLine = Get-Content "$env:TEMP\cf_stdout.log" | Select-String -Pattern "https://.*trycloudflare.com" | Select-Object -First 1
          if ($urlLine) {
              $tunnelUrl = $urlLine.Matches.Value
              "TUNNEL_URL=$tunnelUrl" | Out-File -Append $env:GITHUB_ENV
              Write-Host "=============================================="
              Write-Host "🌐 YOUR ACCESS URL: $tunnelUrl"
              Write-Host "👤 VNC Password: Bullet@12345 (or as set)"
              Write-Host "=============================================="
          } else {
              Write-Host "❌ Quick Tunnel URL পাওয়া যায়নি। cf_stdout.log দেখুন:"
              Get-Content "$env:TEMP\cf_stdout.log"
          }

          # cloudflared প্রসেস ID save
          "CF_PID=$($proc.Id)" | Out-File -Append $env:GITHUB_ENV

      - name: Keep Alive Loop (URL সহ)
        run: |
          $end = (Get-Date).AddMinutes([int]$env:RUNTIME_MINUTES)
          while ((Get-Date) -lt $end) {
              Write-Host "=============================================="
              Write-Host "🟢 Session Active Until: $end"
              Write-Host "🌐 Access URL: $env:TUNNEL_URL"
              Write-Host "👤 VNC Password: Bullet@12345"
              Write-Host "=============================================="
              Start-Sleep -Seconds 60
          }
